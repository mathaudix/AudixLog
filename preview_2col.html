<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f1f5f9;padding:16px}
h2{font-size:15px;margin:0 0 6px}
.wrap{display:flex;flex-direction:column;gap:14px;width:max-content}
.lbl{font-size:12px;color:#334155}
.roll{position:relative;width:110mm;height:30mm;background:#e2e8f0;border:1px dashed #64748b;box-sizing:border-box}
.paper{position:absolute;top:0;height:30mm;width:50mm;background:#fff;border:1px solid #94a3b8;box-sizing:border-box}
.print{position:relative;width:106mm;height:30mm;background:#fff;outline:1px solid #0f172a;overflow:hidden}
.item{position:absolute;top:0mm;height:30mm;width:50mm;box-sizing:border-box;padding:1mm 1.5mm;overflow:hidden;background:#fff}
.item.dash{outline:0.3mm solid #000}
.sup{font-weight:900;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.nf{font-weight:900;font-size:16px;line-height:1}
.br{font-weight:900;font-size:22px;line-height:1}
</style></head><body><div class="wrap">
<h2>100x30 (2 colunas): bobina e impressão</h2>
<div class="lbl">Bobina Argox (liner 110 mm, etiquetas 50 × 30 mm, vão 3,5 mm)</div>
<div class="roll">
  <div class="paper" style="left:3mm"></div>
  <div class="paper" style="left:56.5mm"></div>
</div>
<div class="lbl">Impressão com os padrões (página 106 × 30 mm, margem 3 mm, offset 0)</div>
<div class="print">
  <div class="item" style="left:3mm"><div class="sup">PRIETO ALIMENTOS</div><div class="br">03</div><div class="nf">NF 1047826</div></div>
  <div class="item dash" style="left:56.5mm"><div class="sup">PRIETO ALIMENTOS</div><div class="br">03</div><div class="nf">NF 1047826</div></div>
</div>
</div></body></html>
